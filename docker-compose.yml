# Pulse — local/prod-ish stack: Postgres + Redis + API + Celery worker + beat.
#
# The worker and beat are separate services on purpose. Beat only decides *when*
# something should run and publishes a message; running it inside a worker means
# that scaling to two workers schedules everything twice.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      # Overridable, and only a development default. Postgres applies it when
      # the volume is first initialised; changing it later needs ALTER USER.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: pulse
    # Loopback only. Docker publishes ports with its own iptables rules, which
    # bypass ufw — "5432:5432" put this database, with its well-known
    # development password, on every interface of the host. The other services
    # reach it over the compose network and never needed the port at all.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    # Loopback only, for the same reason as the database: this Redis has no
    # password, and it holds the Celery queue and every rate-limit counter.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192M

  api:
    build: ./backend
    restart: unless-stopped
    # Migrate before serving: a fresh volume otherwise starts an API against an
    # empty schema, and every request 500s until someone runs alembic by hand.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 20"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:${POSTGRES_PASSWORD:-pulse}@db:5432/pulse
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    # Loopback: put Caddy (or an SSH tunnel) in front rather than the raw
    # uvicorn port on a public interface.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    stop_grace_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:${POSTGRES_PASSWORD:-pulse}@db:5432/pulse
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
      - ./keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping --timeout 5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    stop_grace_period: 420s

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:${POSTGRES_PASSWORD:-pulse}@db:5432/pulse
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
      - ./keys:/app/keys
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
