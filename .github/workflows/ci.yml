name: CI

# Pulse had no CI: nothing ran the suite, the lint or the migrations on a
# push, so a change could reach `deploy/deploy.sh` having never been tested
# anywhere but the laptop it was written on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# For a pull request a second push makes the first run's answer irrelevant,
# so it is cancelled. Not on main: there every commit needs its own verdict.
# Cancelling there left most of a burst of pushes "cancelled", so a red run
# could not say which commit broke it and the last green commit — what a
# rollback wants — could not be looked up. Each main commit gets its own group,
# because a shared group still drops all but the newest pending run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, test, migrate)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Not for the test suite — tests/conftest.py points it at in-memory SQLite.
    # It is here for the migration step, the only thing in CI that touches the
    # database Pulse actually deploys against.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (correctness rules)
        # Syntax errors, undefined names and broken comparisons only. The full
        # rule set reports ~120 style findings the tree has never been held
        # to; gating on it would make CI red from its first run, which is how
        # a red CI stops being read. Widen the selection as files are cleaned.
        # Never `ruff format`: the source is hand-formatted.
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Test
        # No env on purpose: tests/conftest.py assigns its own (in-memory
        # SQLite, no broker), so what runs here is what runs locally.
        # --cov runs the gate pyproject.toml configures (source, branch mode,
        # fail_under). Without it pytest-cov was installed on every run and
        # the floor it guards was never checked anywhere.
        run: pytest -q -p no:cacheprovider --cov

      - name: Migrate a fresh Postgres to head
        # The suite builds its schema with create_all on SQLite; this is the
        # check that the Alembic chain itself applies, on PostgreSQL, from
        # nothing — what a new deployment or a restored backup goes through.
        env:
          DATABASE_URL: postgresql+psycopg://pulse:pulse@localhost:5432/pulse_ci
        run: alembic upgrade head

      - name: Roll every migration back and forward again
        # rollback.sh --db-only runs alembic downgrade, and nothing had ever run
        # one on PostgreSQL: the first would have been during the incident it
        # is for, and a downgrade that raised there leaves the database between
        # two revisions with the old code waiting to start. Down to base and up
        # again proves every downgrade executes and the chain still rebuilds.
        env:
          DATABASE_URL: postgresql+psycopg://pulse:pulse@localhost:5432/pulse_ci
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend (test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        # With coverage, which is what runs vitest.config.js's thresholds.
        # `npm test` (plain `vitest run`) measured nothing, so the floor that
        # file calls the gate was checked nowhere and could rot to any number.
        run: npm run test:coverage

      - name: Build
        # Also runs the prerender (vite.config.js), so a page whose head cannot
        # be baked fails here rather than on the box.
        run: npm run build
